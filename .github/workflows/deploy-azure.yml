name: Deploy to Azure

# ── Required GitHub Secrets ──────────────────────────────────────────────────
# AZURE_CREDENTIALS              Service principal JSON  (az ad sp create-for-rbac)
# AZURE_RESOURCE_GROUP           Resource group containing Container App
# AZURE_CONTAINER_APP_NAME       Container App name
# BACKEND_URL                    Container Apps URL  (e.g. https://exstore.xyz.azurecontainerapps.io)
# AZURE_STATIC_WEB_APPS_API_TOKEN  Deployment token from Static Web Apps resource
# GHCR_TOKEN                     GitHub PAT with read:packages + write:packages scopes
#                                 (Container App uses this to pull the image on scale-out)
# ─────────────────────────────────────────────────────────────────────────────
# One-time Azure setup (run once via CLI or Azure Portal env vars):
#   az containerapp update \
#     --name <app> --resource-group <rg> \
#     --set-env-vars \
#       ASPNETCORE_ENVIRONMENT=Production \
#       AllowedOrigins__0=https://<your-swa>.azurestaticapps.net \
#       BlobStorage__ConnectionString="<your-connection-string>"
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend → Container Apps (via GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/exstore-api:latest
            ghcr.io/${{ github.repository_owner }}/exstore-api:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App — pull from GHCR, scale to zero when idle
        run: |
          az containerapp registry set \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --server ghcr.io \
            --username ${{ github.repository_owner }} \
            --password "${{ secrets.GHCR_TOKEN }}"

          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/exstore-api:${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 1

  deploy-frontend:
    name: Deploy Frontend → Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
        env:
          VITE_API_BASE_URL: ${{ secrets.BACKEND_URL }}

