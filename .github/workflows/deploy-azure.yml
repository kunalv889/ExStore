name: Deploy to Azure

# ── Required GitHub Secrets ──────────────────────────────────────────────────
# AZURE_CREDENTIALS              Service principal JSON  (az ad sp create-for-rbac)
# AZURE_RESOURCE_GROUP           Resource group containing Container App + ACR
# AZURE_REGISTRY_NAME            Azure Container Registry name  (e.g. exstoreacr)
# AZURE_CONTAINER_APP_NAME       Container App name
# BACKEND_URL                    Container Apps URL  (e.g. https://exstore.xyz.azurecontainerapps.io)
# AZURE_STATIC_WEB_APPS_API_TOKEN  Deployment token from Static Web Apps resource
# ─────────────────────────────────────────────────────────────────────────────
# One-time Azure setup (after first deploy to get the URLs):
#   az containerapp update \
#     --name <app> --resource-group <rg> \
#     --set-env-vars \
#       ASPNETCORE_ENVIRONMENT=Production \
#       AllowedOrigins__0=https://<your-swa>.azurestaticapps.net \
#       BlobStorage__ConnectionString="<your-connection-string>"
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend → Container Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Container App to pull from ACR
        run: |
          az acr update --name ${{ secrets.AZURE_REGISTRY_NAME }} --admin-enabled true
          ACR_PASSWORD=$(az acr credential show \
            --name ${{ secrets.AZURE_REGISTRY_NAME }} \
            --query "passwords[0].value" -o tsv)
          az containerapp registry set \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --server ${{ secrets.AZURE_REGISTRY_NAME }}.azurecr.io \
            --username ${{ secrets.AZURE_REGISTRY_NAME }} \
            --password "$ACR_PASSWORD"

      - name: Build and deploy to Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.AZURE_REGISTRY_NAME }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          dockerfilePath: Dockerfile
          appSourcePath: backend

  deploy-frontend:
    name: Deploy Frontend → Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.BACKEND_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true

